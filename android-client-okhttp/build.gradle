apply plugin: 'com.android.library'

android {
    compileSdkVersion 35
    namespace "io.msgs.okhttp"
    defaultConfig {
        minSdkVersion 14
        targetSdkVersion 35
        versionCode 1
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

}

ext {
    bintrayRepo = 'msgs-client'
    bintrayName = 'msgs.io'

    publishedGroupId = 'io.msgs'
    libraryName = 'android-client-okhttp'
    artifact = 'android-client-okhttp'

    libraryDescription = 'Egeniq Notification Library for Android'

    siteUrl = 'https://github.com/egeniq/libmsgs-android'
    gitUrl = 'https://github.com/egeniq/libmsgs-android'

    libraryVersion = "1.2.0"

    developerId = 'egeniq'
    developerName = 'Egeniq B.V'
    developerEmail = 'info@egeniq.com'

    organization = 'egeniq'

    licenseName = 'The Apache Software License, Version 2.0'
    licenseUrl = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
    allLicenses = ["Apache-2.0"]
}

dependencies {
    api project(':android-client')
    api 'com.squareup.okhttp3:okhttp:3.14.3' // Latest version with minsdk < 21
}
